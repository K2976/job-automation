# Render Blueprint for the FastAPI backend. Durable state lives in an EXTERNAL managed
# Postgres (Neon project "job-automation") — Render does NOT provision the database here.
# Secrets use sync:false — set them in the Render dashboard, never in the repo.
# The V3 browser worker is NOT here — it runs only on the MacBook in Docker (see
# docs/production-architecture.md and docs/deployment-runbook.md).
services:
  - type: web
    name: adaptive-resume-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --app-dir backend --host 0.0.0.0 --port $PORT
    # HTTP liveness — restarts the service if the app hangs while still holding the port.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Durable state: the Neon Postgres pooled connection string, supplied externally
      # (Dashboard → Environment). Must include ?sslmode=require. Omit it and the app falls
      # back to ephemeral SQLite (fine for a single throwaway demo, lost on redeploy).
      # See docs/manual-cloud-setup.md.
      - key: DATABASE_URL
        sync: false
      # Remote browser worker channel (§13). Generate: python -c "import secrets;print(secrets.token_urlsafe(32))"
      # Set the SAME value in the MacBook worker's .env.worker. Empty ⇒ channel refused.
      - key: WORKER_AUTH_TOKEN
        sync: false
      # The API service must never launch Chromium — only enqueue. The MacBook worker runs it.
      - key: INLINE_APPLICATIONS
        value: "false"
      # Default to the offline mock so a fresh deploy costs nothing until you opt in.
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: local
      # Set these in the dashboard when switching LLM_PROVIDER to groq/gemini:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_AUTH
        value: query
      # Set to your Vercel URL after the frontend is deployed, then redeploy.
      - key: CORS_ORIGINS
        sync: false
      # V2 opportunity discovery. Live by default via Greenhouse + Lever (official no-auth
      # JSON feeds). Board defaults live in config.py; override the lists here to change them.
      - key: OPPORTUNITY_SOURCES
        value: greenhouse,lever
      - key: GREENHOUSE_BOARDS
        sync: false
      - key: LEVER_BOARDS
        sync: false
