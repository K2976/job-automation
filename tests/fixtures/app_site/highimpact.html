<!doctype html><meta charset="utf-8"><title>Apply — High impact</title>
<h1>Apply: Backend Engineer</h1>
<form id="f">
  <label>Email <input name="email" type="email" required></label><br>
  <label>Expected salary <input name="salary" type="text" required></label><br>
  <button type="submit">Submit application</button>
</form>
<div id="done" hidden>Application submitted.</div>
<script>f.onsubmit = e => { e.preventDefault(); f.hidden = true; done.hidden = false; };</script>
