# Render Blueprint for the FastAPI backend.
# Secrets use sync:false — set them in the Render dashboard, never in the repo.
# NOTE: no persistent disk by default (keeps it free-tier deployable). The SQLite DB is
# therefore ephemeral — it resets on redeploy/spin-down. See docs/deployment.md for the
# persistent-disk upgrade.
services:
  - type: web
    name: adaptive-resume-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --app-dir backend --host 0.0.0.0 --port $PORT
    # HTTP liveness — restarts the service if the app hangs while still holding the port.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Default to the offline mock so a fresh deploy costs nothing until you opt in.
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: local
      # Set these in the dashboard when switching LLM_PROVIDER to groq/gemini:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_AUTH
        value: query
      # Set to your Vercel URL after the frontend is deployed, then redeploy.
      - key: CORS_ORIGINS
        sync: false
      # V2 opportunity discovery. Default to the offline fixture source; add
      # "greenhouse,lever" here and set the board lists in the dashboard to go live.
      - key: OPPORTUNITY_SOURCES
        value: fixtures
      - key: GREENHOUSE_BOARDS
        sync: false
      - key: LEVER_BOARDS
        sync: false
