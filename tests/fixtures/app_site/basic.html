<!doctype html><meta charset="utf-8"><title>Apply — Basic</title>
<h1>Apply: Backend Engineer</h1>
<form id="f">
  <label>First Name <input name="first" type="text" required></label><br>
  <label>Last Name <input name="last" type="text" required></label><br>
  <label>Email <input name="email" type="email" required></label><br>
  <label>Phone <input name="phone" type="tel"></label><br>
  <label>LinkedIn <input name="linkedin" type="url"></label><br>
  <label>Resume <input name="resume" type="file" required></label><br>
  <button type="submit">Submit application</button>
</form>
<div id="done" hidden>Application submitted. Thank you for applying.</div>
<script>
  f.onsubmit = e => { e.preventDefault(); f.hidden = true; done.hidden = false; };
</script>
