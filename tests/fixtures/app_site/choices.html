<!doctype html><meta charset="utf-8"><title>Apply — Choices</title>
<h1>Apply: Backend Engineer</h1>
<form id="f">
  <label>First Name <input name="first" type="text" required></label><br>
  <label>Last Name <input name="last" type="text" required></label><br>
  <label>Email <input name="email" type="email" required></label><br>
  <label>Resume <input name="resume" type="file" required></label><br>
  <select name="team" aria-label="Preferred team?" required>
    <option value="" selected disabled>Choose…</option>
    <option>Engineering</option>
    <option>Sales</option>
  </select><br>
  <input type="radio" name="weekends" value="Yes" aria-label="Willing to work weekends? Yes" required>
  <input type="radio" name="weekends" value="No" aria-label="Willing to work weekends? No"><br>
  <input type="checkbox" name="consent" aria-label="Do you consent to data processing?" required><br>
  <button type="submit">Submit application</button>
</form>
<div id="done" hidden>Application submitted. Thank you for applying.</div>
<script>
  f.onsubmit = e => { e.preventDefault(); f.hidden = true; done.hidden = false; };
</script>
