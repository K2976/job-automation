<!doctype html><meta charset="utf-8"><title>Apply — Unlabeled patterns</title>
<h1>Apply: Backend Engineer</h1>
<form id="f">
  <label>First Name <input name="first" type="text" required></label><br>
  <label>Last Name <input name="last" type="text" required></label><br>
  <label>Email <input name="email" type="email" required></label><br>
  <label>Resume <input name="resume" type="file" required></label><br>

  <!-- aria-labelledby: the common custom-component pattern (react-select / react-aria) -->
  <div id="veteran-q">Veteran status</div>
  <input name="veteran" type="text" aria-labelledby="veteran-q"><br>

  <!-- no formal association at all: label text is just a preceding sibling -->
  <div class="field">
    <div class="field-label">Gender identity</div>
    <div class="field-input"><input name="gender" type="text"></div>
  </div>

  <button type="submit">Submit application</button>
</form>
<div id="done" hidden>Application submitted. Thank you for applying.</div>
<script>
  f.onsubmit = e => { e.preventDefault(); f.hidden = true; done.hidden = false; };
</script>
