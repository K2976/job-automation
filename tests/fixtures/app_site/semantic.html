<!doctype html><meta charset="utf-8"><title>Apply — Semantic</title>
<h1>Apply: Backend Engineer</h1>
<form id="f">
  <label>Email <input name="email" type="email" required></label><br>
  <label>Resume <input name="resume" type="file" required></label><br>
  <label>Why are you interested in this role?
    <textarea name="why" required></textarea></label><br>
  <button type="submit">Submit application</button>
</form>
<div id="done" hidden>Application received. Thank you for applying.</div>
<script>f.onsubmit = e => { e.preventDefault(); f.hidden = true; done.hidden = false; };</script>
